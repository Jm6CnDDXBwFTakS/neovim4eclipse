#
# The settings every developer tool shares (releng/tools/release, releng/tools/neovim, …); each
# tool reads them first, then its own folder's. A local.properties beside this file, ignored by
# git, overrides any of them for one machine; local.properties.example lists the keys meant for that.

# A last paragraph for the commits the tools make, such as a Co-Authored-By: line; none by default.
commit.trailer=

# The public update site, which lists every release (releases/<version>/): the Release tool waits
# for it at tag, InstallCheck installs from it.
site.url=https://jm6cnddxbwftaks.github.io/neovim4eclipse/

# The public key releases are signed with: releng/verify-zip.sh checks the ZIP against it,
# InstallCheck tells p2 to trust it (its fingerprint, computed by common/PgpKey).
signing.key=releng/signing-key.asc
