#
# The Maven tool's settings (releng/tools/maven/MavenUpgrade.java); the ones every tool shares,
# such as commit.trailer, are in releng/tools/common/settings.properties.

# The Maven line the build stays on: the tool moves Maven only to the newest 3.9.x. Tycho decides
# when Maven 4 can be used; moving to it means changing this line, then running the tool
# (docs/UPGRADING.md, "Build tools").
maven.line=3.9

# Maven's KEYS file: the public keys of the release managers who sign Maven and the wrapper. The
# tool checks each download's .asc signature against these keys when gpg is installed. It is on
# apache.org, not on Maven Central, the server the archives and their hashes come from.
maven.keys=https://downloads.apache.org/maven/KEYS
