#
# The Release tool's settings that are the same for everyone (releng/tools/release/Release.java).
# A local.properties beside this file, ignored by git, overrides any of them for one machine;
# local.properties.example lists the keys meant for that.

# The workflow files the tool starts or watches (.github/workflows/). ReleaseToolTest checks that
# each exists, and that the Release workflow still names its reused Build job as below.
build.workflow=build.yml
release.workflow=release.yml
rehearsal.workflow=rehearse-release.yml

# The branch prefix whose pushes start the Release rehearsal (rehearse-release.yml, "on: push").
rehearse.prefix=rehearse/

# The job name the Release workflow's Build gets when it reuses a green Build on main (build.yml).
tested.job=Build (tested on main)

# The public update site, which lists every release (releases/<version>/).
site.url=https://jm6cnddxbwftaks.github.io/neovim4eclipse/

# The public key the release ZIP is signed with (releng/verify-zip.sh checks against it).
signing.key=releng/signing-key.asc

# The arguments of releng/tools/ci/LikeCi.java for the check step's local test run: every test
# group, those CI leaves out included (CONTRIBUTING.md, "Releasing").
tests=--all

# A last paragraph for the commits the tool makes, such as a Co-Authored-By: line; none by default.
commit.trailer=
