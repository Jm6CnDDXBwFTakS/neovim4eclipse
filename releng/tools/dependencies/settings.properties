#
# The Dependency tool's settings (releng/tools/dependencies/Dependencies.java); the ones every tool
# shares, such as commit.trailer, are in releng/tools/common/settings.properties. Which updates are
# made, and which share a commit, is not here: the tool follows .github/dependabot.yml, as
# Dependabot does.

# The copies of a version property, in POMs that cannot use it, are not here: they are the
# section named after the property in releng/version-copies.txt ([tycho.version]), which
# VersionConsistencyTest checks too.

# The libraries the plug-in embeds: it copies their jars into lib/ and ships them, with their
# license files in plugins/.../licenses/. Before such a library moves, the tool checks that the new
# jar carries no license file, that the license files at the new version's tag of its source are
# the same as the copies (source file=copy in licenses/), and that the new version needs no other
# jar at run time (docs/UPGRADING.md, "Embedded library").
embedded=org.msgpack:msgpack-core
embedded.msgpack-core.source=https://raw.githubusercontent.com/msgpack/msgpack-java/v{version}/
embedded.msgpack-core.licenses=NOTICE=msgpack-java-NOTICE.txt LICENSE.txt=Apache-2.0.txt
