#
# The Neovim plug-ins the tests and the gallery run, each pinned to one commit
# (releng/tools/plugins/Pins.java reads this file; docs/UPGRADING.md, "The plug-ins the tests
# run", says more).
#
# The repository holds none of them. `java releng/tools/plugins/TestPlugins.java fetch` downloads
# <repository>/archive/<commit>.zip, compares its SHA-256 with the one here and unpacks it into
# .tool-cache/test-plugins/<name>/. A hash that differs stops the tool. Without a network the plug-in is
# left out and the tests that need it are skipped.
#
# This file is the only place a commit or a hash is written. To move a pin:
#   - with the tool, in two steps: `java releng/tools/plugins/TestPlugins.java update <name>
#     <commit>` (a commit you chose; the tool never looks for a newer one) downloads the archive
#     and prints its path, SHA-256 and VirusTotal address, without opening it; once you have
#     vetted it, `... accept <name> <commit> <sha256>` (the hash you vetted; the archive must
#     still have it) shows its license and changed files and writes the two lines after a yes
#     typed at a terminal (it takes no --yes);
#   - by hand: run `update` for the path and the hash, vet the archive, and set <name>.commit and
#     <name>.sha256 yourself.
# A line is name.field=value with no space before the name or around the =; the tool refuses
# another form, since the tests find a pin by searching this file for "name.commit=".
# Either way: fetch, run the tests, commit this file.

