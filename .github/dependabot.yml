#
# Dependabot opens pull requests when a newer version of something pinned here is released.
# GitHub reads this file from the default branch (main) only.
#
# What it covers:
#   - maven: the <properties> in the root pom.xml (libraries, Tycho, Maven plug-ins, JUnit).
#   - github-actions: the uses: lines in .github/workflows/.
# What it does not cover (update by hand, see docs/UPGRADING.md): the JDK (.java-version), the
# Eclipse release (eclipse-repo.url, a p2 site Dependabot cannot read), Neovim (NVIM_VERSION) and
# the Maven wrapper.
#
# Each pull request still runs the Build workflow, so a broken update shows up as a red check.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for all the Maven build plug-ins and Tycho, which usually move together.
      build-tools:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.eclipse.tycho:*"
      # The libraries embedded in the plug-in depend on each other: msgpack is built against a
      # particular Jackson, and neovim-java against both. One pull request for all of them, so
      # they cannot drift apart (msgpack 0.9.12 alone, built for Jackson 2.20, broke every RPC
      # with our Jackson 2.14; see pull request #3). Still check licenses: docs/UPGRADING.md.
      rpc-libraries:
        patterns:
          - "com.ensarsarajcic.neovim.java:*"
          - "org.msgpack:*"
          - "com.fasterxml.jackson.core:*"
    ignore:
      # Major versions of the embedded libraries change APIs (SLF4J 2 changed how bindings are
      # found, for example) and need a deliberate upgrade; see docs/UPGRADING.md.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # These jars only feed tests/text and tests/swt, and must be the versions of the target
      # Eclipse release (eclipse-repo.url), not the newest on Maven Central: org.eclipse.text
      # 3.14.800, for example, needs OSGi classes those tests do not have. They move with the
      # Eclipse release, by hand (docs/UPGRADING.md, "Eclipse release").
      - dependency-name: "org.eclipse.platform:*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
