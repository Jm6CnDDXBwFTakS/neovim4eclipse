#
# Pushing a tag such as v0.1.0 builds that version and publishes a GitHub Release with the ZIP:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag supplies the version: the build rewrites 0.1.0-SNAPSHOT / 0.1.0.qualifier to 0.1.0
# in the POMs, MANIFEST.MF and feature.xml (inside the runner only; nothing is committed back).
#
# Three jobs, each starting only when the one before succeeded:
#   1. version: checks that the tagged commit is on main, and reads the version from the tag.
#   2. build:   the Build workflow itself (build.yml, called as a reusable workflow) with that
#               version: the same Neovim, UI tests and integration tests as every CI run. It uploads
#               EclipseNeovim-<version>.zip as an artifact of this run.
#   3. publish: downloads that ZIP and creates the GitHub Release.
name: Release

on:
  push:
    tags: ['v*']

# Each job asks for what it needs; nothing by default.
permissions: {}

jobs:
  version:
    name: Tag on main, version from the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read   # for the checkout
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # Releases come from main only: main holds what the Build workflow has tested (it runs on
      # every push to main). A tag on a develop commit, or on any commit main does not contain,
      # stops the release here, before anything is built or published.
      # fetch-depth: 0 fetches the whole history and all branches, so origin/main exists and
      # merge-base can walk back from it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that the tag is on main
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is on main."
          else
            echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main. Tag a commit of main."
            exit 1
          fi
      - id: tag
        # v0.1.0 -> 0.1.0. GITHUB_REF_NAME is the tag name for a tag push.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release
    steps:
      # The build job uploads the ZIP unwrapped (upload-artifact's archive: false), so the artifact
      # is named after the file; download-artifact v8 fetches such a file by that name.
      - uses: actions/download-artifact@v8
        with:
          name: EclipseNeovim-${{ needs.version.outputs.version }}.zip
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # no checkout here, so gh cannot find the repository itself
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "dist/EclipseNeovim-${VERSION}.zip"
          --title "Eclipse Neovim ${VERSION}"
          --generate-notes
