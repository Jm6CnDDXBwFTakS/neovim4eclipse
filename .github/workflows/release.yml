#
# Pushing a tag such as v0.1.0 builds that version and publishes a GitHub Release with the ZIP:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag supplies the version: the build rewrites 0.1.0-SNAPSHOT / 0.1.0.qualifier to 0.1.0
# in the POMs, MANIFEST.MF and feature.xml (inside the runner only; nothing is committed back).
#
# Five jobs, each starting only when the one before succeeded:
#   1. version: checks that the tagged commit is on main, that CHANGELOG.md has a section for
#               the version, and that the six Neovim archives Get Neovim installs still match the
#               plug-in's data file; reads the version from the tag; and looks for a successful
#               Build run on main for the tagged commit.
#   2. build:   the Build workflow itself (build.yml, called as a reusable workflow) with that
#               version. It uploads neovim4eclipse-<version>.zip as an artifact of this run. The
#               build is unsigned and sees no secrets, exactly as on main. When the Build on main
#               passed for this commit (the usual case: CONTRIBUTING.md, "Releasing", step 2), it
#               only builds the ZIP (skip-tests): the same tests on the same commit would only
#               give the same answer, at a cost of about an hour of Windows and macOS minutes
#               (counted 2x and 10x). Otherwise it runs every test, as every CI run does. It is
#               rebuilt either way, since only this build stamps the release version into the ZIP.
#   3. sign:    signs that ZIP with the project's PGP key (releng/sign.sh) and uploads the result
#               as neovim4eclipse-<version>.signed.zip. Only this job can read the key: it is a secret of the
#               GitHub environment "release", which only v* tags may use. See
#               docs/design/MARKETPLACE.md, "Phase 4".
#   4. publish: downloads the signed ZIP and creates the GitHub Release with it, named
#               neovim4eclipse-<version>.zip, with the version's CHANGELOG.md section as its notes.
#   5. site:    the Update site workflow (update-site.yml, called as a reusable workflow): rebuilds
#               the p2 update site on GitHub Pages from every release, now including this one, and
#               installs from it into Eclipse 4.34 as a smoke test. If only this job fails, the
#               release is out; fix the cause and rebuild the site with Run workflow.
name: Release

on:
  push:
    tags: ['v*']

# Each job asks for what it needs; nothing by default.
permissions: {}

jobs:
  version:
    name: Tag on main, version from the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read   # for the checkout
      actions: read    # to list the Build workflow's runs
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      # Releases come from main only: main holds what the Build workflow has tested (it runs on
      # every push to main). A tag on a release-branch commit main does not have yet, or any other
      # stops the release here, before anything is built or published.
      # fetch-depth: 0 fetches the whole history and all branches, so origin/main exists and
      # merge-base can walk back from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check that the tag is on main
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is on main."
          else
            echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main. Tag a commit of main."
            exit 1
          fi
      - id: tag
        # v0.1.0 -> 0.1.0. GITHUB_REF_NAME is the tag name for a tag push. Only vX.Y.Z is a
        # release: Git allows $, ` and ; in a tag name (v1$(id)), and the version ends up in shell
        # lines, Maven arguments and file names, so anything else stops here, before any of them.
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like v1.2.3; this one does not, so nothing is released."
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Here, before the build, so that a forgotten changelog stops the release in seconds rather
      # than after the whole build. The output is thrown away; publish reads the notes again.
      - name: Check that CHANGELOG.md has a section for ${{ steps.tag.outputs.version }}
        env:
          VERSION: ${{ steps.tag.outputs.version }}   # through env, never pasted into the script
        run: releng/release-notes.sh "$VERSION" > /dev/null
      # Get Neovim installs only an archive whose SHA-256 equals the one pinned in
      # util/neovim-downloads.properties. CI downloads three of the six archives (and checks them);
      # this downloads all six and compares each with the file and with GitHub's published digest,
      # so a release never ships a pin that no longer matches (about 70 MB, once per release).
      # Nothing is written. See releng/UpdateNeovimDownloads.java and docs/design/DOWNLOAD_NEOVIM.md.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Check the pinned Neovim archives
        env:
          GITHUB_TOKEN: ${{ github.token }}   # GitHub's API, with this run's rate limit
        run: java releng/UpdateNeovimDownloads.java --check
      # A successful Build run (push or Run workflow, every job: Linux UI, integration, Windows,
      # macOS) on main for exactly this commit means the tests already passed on it; the build job
      # then skips them. Example: v0.2.0 tagged 9dde160, whose push to main ran Build 41404567004.
      # Anything else (none yet, still running, failed, or an error from the API) answers false,
      # and the release runs every test, as before this check existed.
      #
      # Only push and Run workflow (workflow_dispatch) runs of this repository count. A run's
      # "branch" is its head branch, and a pull request from a fork's own main has head branch main
      # too, but its run tests the pull request merged into main, and the fork's copy of build.yml.
      # Without the filter, tagging that commit would skip the tests even though main's own Build
      # failed or never ran (gh run list cannot filter on two events, hence the API and jq).
      - name: Look for a green Build of this commit on main
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$GITHUB_SHA&branch=main&status=success&per_page=100" \
                  --jq '[.workflow_runs[] | select((.event == "push" or .event == "workflow_dispatch")
                          and .head_repository.full_name == $ENV.GITHUB_REPOSITORY)] | .[0].html_url // empty') || run=''
          if [ -n "$run" ]; then
            echo "Build passed on main for $GITHUB_SHA: $run. The release build skips the tests."
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "No successful Build on main for $GITHUB_SHA: the release build runs every test."
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      skip-tests: ${{ needs.version.outputs.tested == 'true' }}   # job outputs are strings

  sign:
    name: Sign with PGP
    needs: [version, build]
    runs-on: ubuntu-latest
    # The environment holds the secrets MAVEN_GPG_KEY and MAVEN_GPG_PASSPHRASE. Its rule
    # ("Deployment branches and tags": only tags v*) is what keeps them away from any other run,
    # such as a workflow edited on a branch.
    environment: release
    permissions:
      contents: read   # for the checkout
    env:
      # Not named ZIP: zip(1) reads $ZIP as extra arguments (see releng/sign.sh).
      SITE_ZIP: neovim4eclipse-${{ needs.version.outputs.version }}.zip
      SIGNED_ZIP: neovim4eclipse-${{ needs.version.outputs.version }}.signed.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fail here, before the secrets are touched, rather than publish an unsigned release.
      - name: Check that the public key is in the repository
        run: |
          if [ ! -s releng/signing-key.asc ]; then
            echo "::error::releng/signing-key.asc is missing: releases are signed. See docs/design/MARKETPLACE.md, \"The maintainer's part\"."
            exit 1
          fi
      # For ./mvnw, which runs the signer (releng/sign/pom.xml).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.SITE_ZIP }}
          path: unsigned
          skip-decompress: true   # keep the ZIP itself (see the publish job)
      - name: Sign and verify
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mkdir signed
          releng/sign.sh "unsigned/$SITE_ZIP" "signed/$SIGNED_ZIP" releng/signing-key.asc
      # A name of its own (.signed.zip), so the artifact cannot be confused with the build's
      # unsigned one. The v0.1.4 tag's second run used the same name with overwrite: true, which
      # left two artifacts of that name, and publish downloaded the unsigned one (its signed-ZIP
      # check stopped it). publish renames the file back to neovim4eclipse-<version>.zip.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: signed/${{ env.SIGNED_ZIP }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release
    steps:
      # For CHANGELOG.md and releng/release-notes.sh, and so that gh knows the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The sign job uploads the ZIP unwrapped (upload-artifact's archive: false), so the artifact
      # is named after the file; download-artifact v8 fetches such a file by that name.
      # skip-decompress: by default download-artifact unpacks any ZIP it downloads, which would
      # leave the update site's files in dist/ instead of the ZIP itself (the v0.1.0 tag's first
      # run failed that way: "no matches found for dist/neovim4eclipse-0.1.0.zip").
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: neovim4eclipse-${{ needs.version.outputs.version }}.signed.zip
          path: dist
          skip-decompress: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        # The notes are the version's CHANGELOG.md section, written to a file outside the checkout.
        # The check lists dist/ when the ZIP is not where expected, so a failure shows what arrived.
        run: |
          zip="dist/neovim4eclipse-${VERSION}.zip"
          # The release asset keeps the usual name; .signed only told the artifacts apart.
          if [ -f "dist/neovim4eclipse-${VERSION}.signed.zip" ]; then
            mv "dist/neovim4eclipse-${VERSION}.signed.zip" "$zip"
          fi
          if [ ! -f "$zip" ]; then
            echo "::error::$zip not found; dist/ holds:"; ls -lR dist; exit 1
          fi
          unzip -l "$zip" | grep -q 'content\.jar$' || { echo "::error::$zip is not the update site"; exit 1; }
          # The sign job checked every signature; this only guards against publishing the
          # unsigned ZIP if the jobs are ever rewired.
          unzip -p "$zip" artifacts.jar > "$RUNNER_TEMP/artifacts.jar"
          unzip -p "$RUNNER_TEMP/artifacts.jar" artifacts.xml | grep -q "name='pgp.signatures'" \
            || { echo "::error::$zip is not signed"; exit 1; }
          releng/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            "$zip" \
            --title "Neovim for Eclipse ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"

  site:
    name: Update site
    needs: publish
    permissions:
      contents: read    # to download the releases
      pages: write      # to deploy to Pages
      id-token: write   # required by the Pages deployment
    uses: ./.github/workflows/update-site.yml
