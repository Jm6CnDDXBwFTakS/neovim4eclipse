#
# Pushing a tag such as v0.1.0 builds that version and publishes a GitHub Release with the ZIP:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag supplies the version: the build rewrites 0.1.0-SNAPSHOT / 0.1.0.qualifier to 0.1.0
# in the POMs, MANIFEST.MF and feature.xml (inside the runner only; nothing is committed back).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Tycho's own goal keeps POMs, MANIFEST.MF and feature.xml in step.
          ./mvnw -B -ntp org.eclipse.tycho:tycho-versions-plugin:set-version -DnewVersion="$VERSION"
      # The UI tests need a display (xvfb-run); without nvim their end-to-end part is skipped.
      - run: xvfb-run -a ./mvnw -B -ntp verify
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "releng/io.github.jm6cnddxbwftaks.eclipseneovim.updatesite/target/EclipseNeovim-${VERSION}.zip"
          --title "Eclipse Neovim ${VERSION}"
          --generate-notes
