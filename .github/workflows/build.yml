#
# Builds the plug-in and the installable ZIP on every push and pull request to main, and on
# demand: Actions tab > Build > Run workflow. The update-site ZIP is attached to the run as it is
# (neovim4eclipse-<version>.zip, not wrapped in another ZIP), ready for Help > Install New Software
# > Add > Archive, and kept for 90 days. The build also runs the workbench (UI) tests, end-to-end ones
# included, inside a virtual X display (xvfb-run) with a pinned Neovim.
#
# It is also a reusable workflow (workflow_call): release.yml runs this same build for a tag, with
# the version taken from the tag, so a release is built and tested exactly like every CI run. Keep
# the build steps here only.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: >-
          Build this release version (for example 0.1.0) instead of the -SNAPSHOT / .qualifier one
          in the POMs. Empty (the default, and always on push, pull request and manual runs): build
          the version as committed.
        type: string
        default: ''

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same Neovim as the developer machine. To change it, see docs/UPGRADING.md.
  NVIM_VERSION: v0.12.4

jobs:
  build:
    name: Build, unit and UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version   # the JDK version, kept in one file
          cache: maven   # caches ~/.m2/repository, keyed on the pom.xml files
      # Only when release.yml passes a version. inputs.version is empty or absent otherwise, and an
      # empty string is false in an if: expression. Tycho's own goal rewrites 0.1.0-SNAPSHOT and
      # 0.1.0.qualifier to the release version in the POMs, MANIFEST.MF and feature.xml together,
      # inside the runner only (nothing is committed back), so the ZIP is neovim4eclipse-0.1.0.zip.
      - name: Set version ${{ inputs.version }}
        if: ${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: ./mvnw -B -ntp org.eclipse.tycho:tycho-versions-plugin:set-version -DnewVersion="$VERSION"
      # Ubuntu's packaged Neovim is too old, so use the official release tarball.
      - name: Install Neovim ${{ env.NVIM_VERSION }}
        run: |
          curl -fsSL -o nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          tar -xzf nvim.tar.gz -C "$RUNNER_TEMP"
      # verify = compile, unit tests, feature, p2 repository and the ZIP (see README "Build and
      # test"); -Pui adds the UI tests, which are off by default because they open a window. They
      # need an X display: xvfb-run provides a virtual one.
      - run: >
          xvfb-run -a ./mvnw -B -ntp verify -Pui
          -Dnvim.path=$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim
      - uses: actions/upload-artifact@v7
        with:
          # archive: false (upload-artifact v7+) uploads the single file as it is, instead of
          # wrapping it in a ZIP of its own; the artifact is then named after the file.
          archive: false
          path: releng/io.github.jm6cnddxbwftaks.neovim4eclipse.updatesite/target/neovim4eclipse-*.zip
          if-no-files-found: error

  integration:
    name: Integration tests (real Neovim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version   # the JDK version, kept in one file
          cache: maven
      # Ubuntu's packaged Neovim is too old, so use the official release tarball.
      - name: Install Neovim ${{ env.NVIM_VERSION }}
        run: |
          curl -fsSL -o nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          tar -xzf nvim.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --version | head -1
      - run: >
          ./mvnw -B -ntp test -f tests/unit/pom.xml -Pintegration
          -Dnvim.path=$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim
