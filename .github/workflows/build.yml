#
# Builds the plug-in and the installable ZIP on every push and pull request to main, and on
# demand on any branch: Actions tab > Build > Run workflow, or
#   gh workflow run build.yml --ref release/0.1.2
# Release, fix/ and feature/ branches are not built automatically, to save Actions minutes: run the
# workflow by hand when a change needs CI. At a release, the run on main is the test run, which the
# Release workflow then reuses (CONTRIBUTING.md, "Releasing"). The update-site ZIP is attached to the run as it is
# (neovim4eclipse-<version>.zip, not wrapped in another ZIP), ready for Help > Install New Software
# > Add > Archive, and kept for 90 days. The build also runs the workbench (UI) tests, end-to-end ones
# included, inside a virtual X display (xvfb-run) with a pinned Neovim. The platforms job runs the
# same tests on Windows and macOS, so every OS the plug-in claims to support is tested on each run.
#
# It is also a reusable workflow (workflow_call): release.yml runs this same build for a tag, with
# the version taken from the tag, so a release is built exactly like every CI run. Keep the build
# steps here only. When the tagged commit already passed this workflow on main, release.yml passes
# skip-tests: true, and only the ZIP is built: the tests ran on that very commit minutes before,
# and running them again (Windows minutes count 2x, macOS 10x) would only repeat that answer.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: >-
          Build this release version (for example 0.1.0) instead of the -SNAPSHOT / .qualifier one
          in the POMs. Empty (the default, and always on push, pull request and manual runs): build
          the version as committed.
        type: string
        default: ''
      skip-tests:
        description: >-
          Build the ZIP without running any test: the build job runs verify -DskipTests without
          -Pui, and the integration and platforms jobs are skipped. Only for release.yml, when
          this workflow already passed on main for the same commit. False by default; push, pull
          request and manual runs have no inputs, and an absent input is false too, so they always
          run every test.
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One shell for every step on every runner: bash, which GitHub then runs as `bash -e -o pipefail`
# (a failure anywhere in a pipeline fails the step). Without this, Linux and macOS steps ran in
# `bash -e` without pipefail and Windows steps in PowerShell, so the same line could pass on one
# runner and fail on another. On Windows it is Git for Windows' bash.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ inputs.skip-tests && 'Build (tested on main)' || 'Build, unit and UI tests' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version   # the JDK version, kept in one file
          cache: maven   # caches ~/.m2/repository, keyed on the pom.xml files
      # The Maven wrapper downloads Maven itself on a fresh runner (setup-java's cache holds
      # ~/.m2/repository, not ~/.m2/wrapper), once, with no retry of its own; one dropped
      # connection there failed the whole job. Tried up to three times here, so later steps find it.
      - name: Download Maven (retried)
        run: for try in 1 2 3; do ./mvnw -B -q --version && break; [ "$try" = 3 ] && exit 1; sleep 15; done
      # Only when release.yml passes a version. inputs.version is empty or absent otherwise, and an
      # empty string is false in an if: expression. Tycho's own goal rewrites 0.1.0-SNAPSHOT and
      # 0.1.0.qualifier to the release version in the POMs, MANIFEST.MF and feature.xml together,
      # inside the runner only (nothing is committed back), so the ZIP is neovim4eclipse-0.1.0.zip.
      - name: Set version ${{ inputs.version }}
        if: ${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: ./mvnw -B -ntp org.eclipse.tycho:tycho-versions-plugin:set-version -DnewVersion="$VERSION"
      # Ubuntu's packaged Neovim is too old, so use the official release archive: exactly the one
      # Get Neovim installs (util/neovim-downloads.properties, util/NeovimVersion.MINIMUM), for the
      # runner's platform (auto), its size, SHA-256 and tree hash checked, in Java so no runner
      # tool's output format matters. It prints the program's path, kept in NVIM for the next steps.
      # Only for the tests. "!inputs.skip-tests": an absent input (push, pull request) is false.
      - name: Install Neovim
        if: ${{ !inputs.skip-tests }}
        # The assignment on its own line, so a failed check fails the step (set -e does not see a
        # failure inside an echo's arguments).
        run: |
          nvim=$(java releng/UpdateNeovimDownloads.java install auto "$RUNNER_TEMP")
          echo "NVIM=$nvim" >> "$GITHUB_ENV"
      # The release scripts run only at a tag (signing, the update site), so a mistake in one shows
      # up late; shellcheck reads them for the usual shell traps in a second: unquoted variables,
      # bash syntax under #!/bin/sh, GNU-only flags. LikeCi runs the same. It comes with the runner
      # image today; installed if a new image drops it. Not at a release (skip-tests): the branch's
      # Build linted this very commit, and a newer shellcheck in a new runner image, with a warning
      # the old one did not have, must not stop a tagged release.
      - name: Lint the shell scripts
        if: ${{ !inputs.skip-tests }}
        run: |
          command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck releng/*.sh mvnw
      # xvfb-run comes with the runner image today; installed if a new image drops it. Its screen is
      # given, not left to the xvfb-run script's default, which differs between versions and decides
      # how much room the UI tests' windows get. java releng/tools/ci/LikeCi.java uses the same.
      - name: Make sure xvfb-run is there
        if: ${{ !inputs.skip-tests }}
        run: command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      # verify = compile, unit tests, feature, p2 repository and the ZIP (see README "Build and
      # test"); -Pui adds the UI tests, which are off by default because they open a window. They
      # need an X display: xvfb-run provides a virtual one.
      - name: Build, unit and UI tests
        if: ${{ !inputs.skip-tests }}
        run: >
          xvfb-run -a -s "-screen 0 1280x1024x24" ./mvnw -B -ntp verify -Pui
          -Dnvim.path=$NVIM
      # The same build with every test left out (the test modules are still compiled): the ZIP
      # alone, at the version release.yml set above.
      - name: Build only (the tests passed on main)
        if: ${{ inputs.skip-tests }}
        run: ./mvnw -B -ntp verify -DskipTests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # archive: false (upload-artifact v7+) uploads the single file as it is, instead of
          # wrapping it in a ZIP of its own; the artifact is then named after the file.
          archive: false
          path: releng/io.github.jm6cnddxbwftaks.neovim4eclipse.updatesite/target/neovim4eclipse-*.zip
          if-no-files-found: error

  integration:
    name: Integration tests (real Neovim)
    if: ${{ !inputs.skip-tests }}   # see the build job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version   # the JDK version, kept in one file
          cache: maven
      # The Maven wrapper downloads Maven itself on a fresh runner (setup-java's cache holds
      # ~/.m2/repository, not ~/.m2/wrapper), once, with no retry of its own; one dropped
      # connection there failed the whole job. Tried up to three times here, so later steps find it.
      - name: Download Maven (retried)
        run: for try in 1 2 3; do ./mvnw -B -q --version && break; [ "$try" = 3 ] && exit 1; sleep 15; done
      # As in the build job: the archive Get Neovim installs, its SHA-256 checked.
      - name: Install Neovim
        # The assignment on its own line, so a failed check fails the step (set -e does not see a
        # failure inside an echo's arguments).
        run: |
          nvim=$(java releng/UpdateNeovimDownloads.java install auto "$RUNNER_TEMP")
          echo "NVIM=$nvim" >> "$GITHUB_ENV"
      - run: >
          ./mvnw -B -ntp test -f tests/unit/pom.xml -Pintegration
          -Dnvim.path=$NVIM

  # The two jobs above run on Linux only; this one runs the same tests on the other two systems
  # the plug-in (and its Marketplace listing) supports, because the parts that differ per OS are
  # exactly the ones Linux cannot test: finding nvim.exe on PATH/PATHEXT and in the usual install
  # folders (util/NvimExecutable), Windows' SHELL handling, CRLF line endings, and SWT's own
  # Win32 and Cocoa key events, clipboard and focus in the SWT and UI tests. See docs/PLATFORM.md.
  #
  # Each runner builds everything again (the plug-in is pure Java, so the jar is the same on every
  # OS; only the Linux job uploads the ZIP). No xvfb-run: Windows and macOS runners have a real
  # desktop session. On macOS the test POMs add -XstartOnFirstThread themselves (Cocoa runs the
  # UI only on the first thread). Each job installs the Neovim for its runner's platform
  # (install auto: windows-latest is x86_64 today, macos-latest Apple silicon), so a runner image
  # that changes processor needs no change here.
  platforms:
    name: All tests on ${{ matrix.name }}
    if: ${{ !inputs.skip-tests }}   # see the build job
    runs-on: ${{ matrix.os }}
    # A UI test that hangs (a dialog nobody closes) would otherwise hold the runner for 6 hours.
    timeout-minutes: 60
    strategy:
      # Let both finish: a failure on one OS only says something different from one on both.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version   # the JDK version, kept in one file
          cache: maven
      # The Maven wrapper downloads Maven itself on a fresh runner (setup-java's cache holds
      # ~/.m2/repository, not ~/.m2/wrapper), once, with no retry of its own; one dropped
      # connection there failed the whole job. Tried up to three times here, so later steps find it.
      - name: Download Maven (retried)
        run: for try in 1 2 3; do ./mvnw -B -q --version && break; [ "$try" = 3 ] && exit 1; sleep 15; done
      # As in the build job, so a release is tested at the version it ships with.
      - name: Set version ${{ inputs.version }}
        if: ${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: ./mvnw -B -ntp org.eclipse.tycho:tycho-versions-plugin:set-version -DnewVersion="$VERSION"
      # As in the build job: the archive Get Neovim installs on this runner's platform, checked.
      - name: Install Neovim
        run: |
          nvim=$(java releng/UpdateNeovimDownloads.java install auto "$RUNNER_TEMP")
          echo "NVIM=$nvim" >> "$GITHUB_ENV"
      # The same as the Linux build job: compile, unit, text-model, SWT and UI tests, feature, ZIP.
      - name: Build, unit and UI tests
        run: ./mvnw -B -ntp verify -Pui "-Dnvim.path=$NVIM"
      # The same as the Linux integration job.
      - name: Integration tests (real Neovim)
        run: ./mvnw -B -ntp test -f tests/unit/pom.xml -Pintegration "-Dnvim.path=$NVIM"
