# Read by both PDE (when Eclipse builds or exports the plug-in) and Tycho (the Maven build).
# source.. / output..: the bundle's own classes (".") come from src/ and are compiled to bin/.
source.. = src/
output.. = bin/
# bin.includes: everything that goes into the built bundle jar. A file missing here works when
# launched from the IDE but is absent once installed. lib/ holds the embedded jars listed in
# MANIFEST.MF's Bundle-ClassPath (copied there by pom.xml); about.html is the legal notice shown
# under Help > About > Installation Details, and licenses/ holds the license texts and notices of the
# libraries in lib/, which their licenses require to travel with them.
bin.includes = META-INF/,\
               .,\
               plugin.xml,\
               about.html,\
               licenses/,\
               lib/
jre.compilation.profile = JavaSE-21
javacSource = 21
javacTarget = 21
