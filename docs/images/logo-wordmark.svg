<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 128" width="700" height="128" role="img" aria-labelledby="title">
  <!-- SPDX-FileCopyrightText: 2026 Jm6CnDDXBwFTakS -->
  <!-- SPDX-License-Identifier: EPL-2.0 -->
  <!--
    The logo (logo.svg, which explains the mark) with the name beside it, for the README header.
    One file for light and dark pages: the name is all in the logo's green (#3c8f3f), which has a
    contrast of at least 3.7:1 on GitHub's light, dark and dimmed backgrounds (3:1 is the WCAG
    minimum for large text). All three words have the same color and weight.
    The name is live text in the system UI font: an SVG shown as an image cannot load web fonts.
    textLength fixes its width, so the layout is the same whichever font the viewer has; only the
    letter spacing changes.
  -->
  <title id="title">Neovim for Eclipse</title>
  <rect width="128" height="128" rx="28" fill="#eef1ea"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#c9cfc2" stroke-width="3"/>
  <line x1="36" y1="38" x2="84" y2="92" stroke="#3c8f3f" stroke-width="15" stroke-linecap="round"/>
  <circle cx="36" cy="38" r="11" fill="#3c8f3f"/>
  <circle cx="36" cy="92" r="11" fill="#3c8f3f"/>
  <rect x="82" y="28" width="13" height="72" rx="3" fill="#35327a"/>
  <rect x="74" y="28" width="29" height="10" rx="3" fill="#35327a"/>
  <rect x="74" y="90" width="29" height="10" rx="3" fill="#35327a"/>
  <rect x="78" y="59" width="21" height="7" rx="2" fill="#35327a"/>
  <text x="158" y="83" textLength="530" lengthAdjust="spacing"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="600" fill="#3c8f3f">Neovim for Eclipse</text>
</svg>
