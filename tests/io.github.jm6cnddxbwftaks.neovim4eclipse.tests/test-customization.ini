#
# Default preferences for the test Eclipse, passed with -pluginCustomization (pom.xml, appArgLine).
# Eclipse applies these after the plug-in's PreferenceInitializer, so they win over its defaults,
# exactly as a product's plugin_customization.ini would. Format: <bundle id>/<key>=<value>.
#
# No welcome: it is a modal dialog, and the first test that starts Neovim would wait for someone
# to close it until the run times out. WelcomeNoticeTest opens the dialog itself, without blocking.
io.github.jm6cnddxbwftaks.neovim4eclipse/showWelcome=false
