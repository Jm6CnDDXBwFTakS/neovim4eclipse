# The tests are a fragment of the plug-in (Fragment-Host in MANIFEST.MF): they share its class loader,
# so they can test its package-private classes. Not packaged into the update site.
# shared/ holds the test helpers every test module uses (TestWait, ExpectedLog); tests/unit, tests/text
# and tests/swt add it as a test source. It lives inside this project because PDE resolves each
# source.. folder inside the project: a ../ path outside it fails the IDE's "Updating classpath" with
# "Resource '/shared' does not exist", and the project does not import.
# shared-swt/ holds the helpers that need SWT (LayoutCheck), for tests/swt and these tests only.
source.. = src/,\
           shared/,\
           shared-swt/
output.. = bin/
bin.includes = META-INF/,\
               fragment.xml,\
               .
